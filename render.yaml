services:
  - type: web
    name: cinder
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: echo "no build step: zero dependencies"
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: CINDER_TRUST_PROXY
        value: "1"
